name: dejav regression tests

on:
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read
  checks: write

jobs:
  dejav:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: sahksas/dejav-action@v1
        with:
          api-key: ${{ secrets.DEJAV_API_KEY }}
          project-id: your-project-id
          target-url: ${{ github.event.deployment_status.environment_url }}
